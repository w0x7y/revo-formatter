[package]
name = "revofmt"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Validated, width-aware formatter for pinned Revo syntax"
repository = "https://github.com/w0x7y/revo-formatter"
exclude = [".tools/**", ".superpowers/**", "graft/**"]

[[bin]]
name = "revofmt"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2.2"
